name: Native components

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Get repository files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record tools
        run: |
          git --version
          python3 --version
          cmake --version
          clang++ --version
      - name: Identify pinned public inputs
        id: public-inputs
        run: |
          digest=$(python3 .github/scripts/reconstruct_ci.py --cache-key)
          echo "key=p710-public-v1-${{ runner.os }}-${{ runner.arch }}-$digest" >> "$GITHUB_OUTPUT"
      - name: Restore pinned public inputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: public-input-cache
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/p710-inputs
          key: ${{ steps.public-inputs.outputs.key }}
      - name: Reconstruct pinned public source
        env:
          WRITE_PUBLIC_INPUT_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.public-input-cache.outputs.cache-hit != 'true' }}
        run: |
          args=(--work "$RUNNER_TEMP/p710" --input-cache "$RUNNER_TEMP/p710-inputs")
          if [ "$WRITE_PUBLIC_INPUT_CACHE" = true ]; then args+=(--write-input-cache); fi
          time python3 .github/scripts/reconstruct_ci.py "${args[@]}"
      - name: Save pinned public inputs from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.public-input-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/p710-inputs
          key: ${{ steps.public-inputs.outputs.key }}
      - name: Build and test native components
        run: |
          status=0
          for mode in debug sanitized; do
            sanitize=OFF
            if [ "$mode" = sanitized ]; then sanitize=ON; fi
            cmake -S "$RUNNER_TEMP/p710/source/tests/native-core" -B "$RUNNER_TEMP/build-$mode" \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_BUILD_TYPE=Debug -DP710_SANITIZERS="$sanitize" \
              -DP710_VFS=OFF -DP710_IMAGES=OFF -DP710_RESOURCE_MANAGERS=OFF \
              -DP710_SDL_PRESENTATION=OFF
            cmake --build "$RUNNER_TEMP/build-$mode" --parallel 2
            ctest --test-dir "$RUNNER_TEMP/build-$mode" --output-on-failure --no-tests=error \
              --output-junit "$RUNNER_TEMP/build-$mode/ctest.xml" || status=1
          done
          exit "$status"
      - name: Verify strategic runtime state guards
        run: |
          python3 -B "$RUNNER_TEMP/p710/source/tests/native-core/check_rebel_command_mission_guards.py" "$RUNNER_TEMP/p710/source"
          python3 -B "$RUNNER_TEMP/p710/source/tests/native-core/check_loyalty_messagebox_state_guards.py" "$RUNNER_TEMP/p710/source"
          python3 -B "$RUNNER_TEMP/p710/source/tests/native-core/check_autoresolve_aim_state_guards.py" "$RUNNER_TEMP/p710/source"
      - name: Verify ownership and bounds regressions
        run: |
          python3 -B "$RUNNER_TEMP/p710/source/tests/native-core/check_popup_string_ownership.py" "$RUNNER_TEMP/p710/source"
          python3 -B "$RUNNER_TEMP/p710/source/tests/native-core/check_credits_state_ownership.py" "$RUNNER_TEMP/p710/source"
          python3 -B "$RUNNER_TEMP/p710/source/tests/native-core/check_postal_delivery_ownership.py" "$RUNNER_TEMP/p710/source"
          python3 -B "$RUNNER_TEMP/p710/source/tests/native-core/check_reinforcement_menu_ownership.py" "$RUNNER_TEMP/p710/source"
      - name: Verify tile-resource ownership regression
        run: |
          python3 -B "$RUNNER_TEMP/p710/source/tests/native-core/check_tile_resource_ownership.py" "$RUNNER_TEMP/p710/source"
      - name: Verify stream-loader lifecycle regression
        run: |
          python3 -B "$RUNNER_TEMP/p710/source/tests/native-core/check_stream_loader_lifecycle.py" "$RUNNER_TEMP/p710/source"
      - name: Verify word-wrap ownership regression
        run: |
          python3 -B "$RUNNER_TEMP/p710/source/tests/native-core/check_wordwrap_ownership.py" "$RUNNER_TEMP/p710/source"
      - name: Verify save-load preflight regression
        run: |
          python3 -B "$RUNNER_TEMP/p710/source/tests/native-core/check_save_load_preflight_guards.py" "$RUNNER_TEMP/p710/source"
          python3 -B "$RUNNER_TEMP/p710/source/tests/native-core/check_save_load_failure_propagation.py" "$RUNNER_TEMP/p710/source"
      - name: Verify attachment completion regression
        run: |
          status=0
          for mode in debug sanitized; do
            sanitize=OFF
            if [ "$mode" = sanitized ]; then sanitize=ON; fi
            cmake -S tests/attachment-completion -B "$RUNNER_TEMP/attachment-$mode" \
              -DCMAKE_CXX_COMPILER=clang++ -DP710_ENGINE_SOURCE="$RUNNER_TEMP/p710/source" \
              -DP710_SDL_HEADERS="$RUNNER_TEMP/p710/sdl/include" \
              -DP710_SANITIZERS="$sanitize" -DP710_ATTACHMENT_UNGUARDED=OFF
            cmake --build "$RUNNER_TEMP/attachment-$mode" --parallel 2
            ctest --test-dir "$RUNNER_TEMP/attachment-$mode" --verbose --no-tests=error \
              --output-junit "$RUNNER_TEMP/attachment-$mode/ctest.xml" || status=1
          done
          exit "$status"
      - name: Upload native CTest reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-native-attempt-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/build-debug/ctest.xml
            ${{ runner.temp }}/build-debug/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/build-debug/Testing/Temporary/LastTestsFailed.log
            ${{ runner.temp }}/attachment-debug/ctest.xml
            ${{ runner.temp }}/attachment-debug/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/attachment-debug/Testing/Temporary/LastTestsFailed.log
      - name: Upload sanitizer CTest reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-sanitizer-attempt-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/build-sanitized/ctest.xml
            ${{ runner.temp }}/build-sanitized/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/build-sanitized/Testing/Temporary/LastTestsFailed.log
            ${{ runner.temp }}/attachment-sanitized/ctest.xml
            ${{ runner.temp }}/attachment-sanitized/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/attachment-sanitized/Testing/Temporary/LastTestsFailed.log
      - name: Find available CTest reports
        if: ${{ !cancelled() }}
        id: ctest-reports
        run: |
          for mode in debug sanitized; do
            if [ -f "$RUNNER_TEMP/build-$mode/ctest.xml" ] ||
               [ -f "$RUNNER_TEMP/attachment-$mode/ctest.xml" ]; then
              echo "$mode=true" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Summarize native CTest results
        if: ${{ !cancelled() && steps.ctest-reports.outputs.debug == 'true' }}
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: |
            ${{ runner.temp }}/build-debug/ctest.xml
            ${{ runner.temp }}/attachment-debug/ctest.xml
          output: ${{ runner.temp }}/p710-native.md
      - name: Summarize sanitizer CTest results
        if: ${{ !cancelled() && steps.ctest-reports.outputs.sanitized == 'true' }}
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: |
            ${{ runner.temp }}/build-sanitized/ctest.xml
            ${{ runner.temp }}/attachment-sanitized/ctest.xml
          output: ${{ runner.temp }}/p710-sanitizer.md
      - name: Publish CTest summaries
        if: ${{ !cancelled() }}
        run: |
          for suite in Native Sanitizer; do
            report="$RUNNER_TEMP/p710-${suite,,}.md"
            if [ -s "$report" ]; then
              {
                printf '## %s CTest\n\n' "$suite"
                cat "$report"
                printf '\n\n'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
